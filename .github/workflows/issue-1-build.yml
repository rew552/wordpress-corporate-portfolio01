name: Issue 1 build and quality
on:
  push:
    branches:
      - fix/issue-1-portfolio-quality
permissions:
  contents: write
jobs:
  build-quality:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-1-portfolio-quality
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install dependencies and update lockfile
        run: npm install --save-dev playwright @axe-core/playwright
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build
        run: npm run build
      - name: Validate
        run: npm run validate
      - name: Browser quality
        run: npm run quality
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json blueprint.json README.md demo/launch.html demo/launch-blueprint.json demo/admin-launch-blueprint.json screenshots/home-desktop.png screenshots/home-mobile.png
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: regenerate Playground artifacts"
            git push
          fi
