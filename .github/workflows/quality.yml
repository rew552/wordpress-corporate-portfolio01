name: Build and quality

on:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'

permissions:
  contents: write

jobs:
  build-quality:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build
        run: npm run build
      - name: Validate
        run: npm run validate
      - name: Commit generated Playground artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blueprint.json demo/launch-blueprint.json demo/admin-launch-blueprint.json
          if git diff --cached --quiet; then
            echo "No generated Playground changes"
          else
            git commit -m "build: regenerate Playground artifacts"
            git push
          fi
      - name: Browser quality
        run: npm run quality
      - name: Upload visual regression evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-actual
          path: screenshots/regression-actual/
          if-no-files-found: ignore

# Visual baselines are intentionally never auto-committed.
# Review regression artifacts and update screenshots/visual-baseline.json explicitly.
